<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #0b0b0c;
      color: #f5f3ee;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto"
    >
      <tr>
        <td style="font-weight: 900; font-size: 16px; letter-spacing: -0.01em">
          POWER<span style="color: #d4ff3a">WEEK</span>
        </td>
      </tr>
      <tr>
        <td style="padding-top: 32px; font-size: 15px; line-height: 1.5">
          Bienvenido a PowerWeek. Tu código para entrar:
        </td>
      </tr>
      <tr>
        <td style="padding: 24px 0">
          <div
            style="
              display: inline-block;
              padding: 16px 24px;
              border-radius: 14px;
              background: #d4ff3a;
              color: #0b0b0c;
              font-family: &quot;Courier New&quot;, monospace;
              font-size: 32px;
              font-weight: 700;
              letter-spacing: 0.3em;
            "
          >
            {{ .Token }}
          </div>
        </td>
      </tr>
      <tr>
        <td style="font-size: 13px; line-height: 1.5; color: #a8a59e">
          Caduca en 15 minutos. Si no lo has pedido tú, ignora este email.<br /><a
            href="{{ .ConfirmationURL }}"
            style="color: #d4ff3a"
            >O confirma con este enlace</a
          >
        </td>
      </tr>
      <tr>
        <td
          style="
            padding-top: 32px;
            border-top: 1px solid #2c2c31;
            font-size: 13px;
            line-height: 1.5;
            color: #a8a59e;
          "
        >
          Welcome to PowerWeek. Your code is above. It expires in 15 minutes.
          <a href="{{ .ConfirmationURL }}" style="color: #d4ff3a">Or confirm with this link.</a>
        </td>
      </tr>
    </table>
  </body>
</html>
