name: Feature or module idea
description: Suggest something PowerWeek should do, or a new module
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Explain the problem before the solution. Spanish is welcome too.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that PowerWeek makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could PowerWeek solve it? Example sentences you'd say to the assistant are very welcome. For a new module, say what it stores and what you'd ask it to do.
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria (optional)
      description: How we'll know it's done, as a short list. A maintainer can help write these.
      placeholder: "- Saying “…” adds …\n- The card shows …\n- Works in Spanish and English"
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options: ["Yes, I'd like to open a pull request", "Maybe, with some guidance", "No"]
